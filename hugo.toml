# The base URL - for local testing we use localhost
baseURL = "https://nskamath.netlify.app/"

# The title that appears on your browser tab
title = "Nagendra S Kamath"

# The language of your site
locale = "en-us"

# This tells Hugo to use our custom theme
theme = "mytheme"

# NAVIGATION MENU
# weight controls the order of menu items
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

  [[menu.main]]
    name = "Academics"
    url = "/academics/"
    weight = 3

  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 4


[taxonomies]
tag = "tags"
  countryname = "country"          # existing — postcards
  whscountryname = "whscountry"    # new — UNESCO sites; front matter field will be "whscountry"  


# This makes external links open in a new tab
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Generate JSON search index
[outputs]
  home = ["HTML", "JSON"]


# ── Math (LaTeX) ──
# "passthrough" tells Hugo's Markdown reader to leave anything between
# these delimiters untouched, so underscores and backslashes in LaTeX
# aren't mistaken for Markdown formatting. The render hook (step 2)
# then turns it into typeset math.
[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
# Display (centred, own line):  $$ ... $$   or   \[ ... \]
block = [['\[', '\]'], ['$$', '$$']]
# Inline (inside a sentence):   $ ... $    or   \( ... \)
inline = [['\(', '\)'], ['$', '$']]
