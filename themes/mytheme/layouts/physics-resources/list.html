{{ define "main" }}

<!-- The accent wrapper sets --section-accent to violet for anything inside -->
<div class="accent-physics">

  <!-- Hero — same monospace style as the /blog/physics/ landing -->
  <div class="physics-hero">
    <h1 class="physics-hero-title">{{ .Params.heading | default .Title }}</h1>
    {{ with .Params.subtitle }}
    <p class="physics-hero-sub">{{ . }}</p>
    {{ end }}
  </div>

  <!-- The page's own written content (your intro text, link lists, etc.) -->
  <div class="physics-content">
    {{ .Content }}
  </div>

  <!-- If this section ever contains posts (regular .md files),
       they appear below as readout-style cards. If there are none,
       this block renders nothing at all. -->
  {{ with .RegularPages }}
  <div class="subsection-tiles physics-tiles">
    {{ range .ByDate.Reverse }}
    <a class="subsection-tile" href="{{ .RelPermalink }}">
      <div class="subsection-tile-title">{{ .Title }}</div>
      {{ with .Params.summary }}
      <div class="subsection-tile-desc">{{ . }}</div>
      {{ end }}
    </a>
    {{ end }}
  </div>
  {{ end }}

</div>

{{ end }}
