{{ define "main" }}

<!-- The body already carries accent-history on these URLs,
     so the hero and tiles pick up the burgundy automatically -->
<div class="section-hero">
  <h1 class="section-hero-title">{{ .Params.heading | default .Title }}</h1>
  {{ with .Params.subtitle }}
  <p class="section-hero-sub">{{ . }}</p>
  {{ end }}
</div>

{{ .Content }}

{{ end }}
