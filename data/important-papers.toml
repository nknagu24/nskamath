# ============================================================
# PHYSICS RESOURCES — one [[resource]] block per item.
# Shown on /blog/physics/resources/.
#
# Fields (only title and kind are required):
#   title  = the name shown as the link
#   url    = where it links to (leave out if there's no link)
#   kind   = the group it's listed under. Use the same spelling
#            every time: "Book", "Review", "Paper", "Course",
#            "Software", "Database", "Video"...
#   author = author(s), as you want them shown
#   year   = publication year (a number, no quotes)
#   topics = list of tags — these become the filter buttons.
#            Keep them lowercase and consistent ("excitons",
#            not sometimes "Exciton")
#   note   = your one-line comment; *italics* and **bold** work
#
# Order in this file doesn't matter: items are grouped by
# kind and sorted by title automatically.
# ============================================================

[[resource]]
